<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="form">
  <h1>Login</h1>

  <input type="email" id="login_user" placeholder="Email">
  <input type="password" id="login_pass" placeholder="Password">

  <button class="btn" onclick="loginUser()">Login</button>

  <p class="link-text">
    <a href="#" onclick="forgotPassword()">Forgot password?</a>
  </p>

  <p class="link-text">
    Don’t have an account?
    <a href="register.html">Register</a>
  </p>
</div>

<script type="module" src="auth.js">// THIS MUST RUN ON YOUR LOGIN PAGE WHEN THE USER CLICKS "SIGN IN"
function performLogin(nameFromInput) {
    // 1. Save to the browser's memory
    localStorage.setItem("isLoggedIn", "true");
    localStorage.setItem("username", nameFromInput); 
    
    // 2. Redirect back to the main page
    window.location.href = "index.html"; 
}</script>
</body>
</html>
