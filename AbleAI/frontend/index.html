<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AbleAI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="app-body">

  <!-- HEADER -->
  <header class="header">
    <div class="header-left">
      <label class="switch">
        <input type="checkbox" id="dark-toggle">
        <span class="slider"></span>
      </label>
    </div>

    <div class="header-center">
      <h1>AbleAI</h1>
    </div>

    <div class="header-right" id="auth-area">
      <!-- Login/Signup or Profile rendered by JS -->
    </div>
  </header>

  <!-- MAIN CARDS -->
  <main class="main">
    <div class="card-container">
  <a href="text.html" class="card">
    <img src="text.jpg" alt="Text">
    <h3>Text</h3>
  </a>

  <a href="voice.html" class="card">
    <img src="voice.jpg" alt="Voice">
    <h3>Voice</h3>
  </a>

  <a href="gestures.html" class="card">
    <img src="gestures.jpg" alt="Gestures">
    <h3>Gestures</h3>
  </a>

  <!-- NEW FACE RECOGNITION CARD -->
  <a href="face.html" class="card">
    <img src="smile.jpg" alt="Face">
    <h3>Face </h3>
  </a>
</div>

  </main>

  <script src="script.js"></script>
</body>
</html>
